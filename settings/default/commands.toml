# XIVLegacy Server: who may use each chat command (typed in game as !command),
# shipped defaults. Don't edit this file: put what you change in
# settings/commands.toml (only what differs; see settings/README.md).
#
# GM levels, set per account with !setgm <level> <character name> (or from
# the map server's console):
#   0 player   1 helper   2 GM   3 senior GM   4 administrator
#
# A command not listed here needs administrator. Commands that aren't retail
# behavior (free teleports, for example) default to GM; lower one to 0 to give
# it to every player on your server.

# The level needed to aim a command at someone else; below it, a command only
# works on whoever typed it.
target_others = 2

[levels]
# everyone
help = 0
who = 0
version = 0

# GMs: moving players around, looking after them
pos = 2
endevent = 2
zone = 2
camp = 2

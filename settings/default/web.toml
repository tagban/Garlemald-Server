# XIVLegacy Server: web (sign-up and sign-in), shipped defaults.
# Don't edit this file: put what differs in settings/web.toml (see settings/README.md).

[server]
bind_ip = "127.0.0.1"
port = 54993
show_timestamp = true

[database]
# Shared SQLite file used by every service. Created (with schema)
# on first run if missing.
path = "./data/garlemald.db"

[session]
# How long a session row lives after a successful login/signup. The lobby
# server rejects rows whose `expiration` is in the past.
hours = 24
